      q=document.getElementById('q'),fv=document.getElementById('fv'),fo=document.getElementById('fo'),
      fy=document.getElementById('fy'),ft=document.getElementById('ft'),
      vols=document.getElementById('vols');
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

/* 卷按钮：按真实篇数生成，点击即筛选，再点取消 */
const vcount={}; DATA.forEach(d=>{vcount[d.v]=(vcount[d.v]||0)+1});
vols.innerHTML=Object.keys(vcount).sort((a,b)=>((a==='0')-(b==='0'))||a-b).map(v=>
  `<li><button type="button" class="vb" data-v="${v}" aria-pressed="false">${v==='0'?'未编入论文集':'第'+v+'卷'}</button><em>${vcount[v]} 篇</em></li>`).join('');
function syncChips(){
  vols.querySelectorAll('.vb').forEach(b=>{
    const on=(fv.value===b.dataset.v);
    b.classList.toggle('on',on);
    b.setAttribute('aria-pressed',on?'true':'false');
    b.parentElement.classList.toggle('on',on);
  });
}
vols.addEventListener('click',e=>{
  const b=e.target.closest('.vb'); if(!b) return;
  fv.value=(fv.value===b.dataset.v)?'':b.dataset.v;
  render();
});

function readHash(){
  const s=location.hash.replace(/^#/,''); if(!s) return;
  const p=new URLSearchParams(s);
  if(p.has('k')) q.value=p.get('k');
  if(p.has('v')) fv.value=p.get('v');
  if(p.has('o')) fo.value=p.get('o');
  if(p.has('l')) fy.value=p.get('l');
  if(p.has('t')) ft.value=p.get('t');
}
function writeHash(){
  const p=new URLSearchParams();
  if(q.value.trim()) p.set('k',q.value.trim());
  if(fv.value) p.set('v',fv.value);
  if(fo.value) p.set('o',fo.value);
  if(fy.value) p.set('l',fy.value);
  if(ft.value) p.set('t',ft.value);
  const s=p.toString();
  if(s) history.replaceState(null,'','#'+s); else history.replaceState(null,'',location.pathname);
}

function render(){
  const k=q.value.trim().toLowerCase();
  const r=DATA.filter(d=>
    (!k||(d.t+' '+d.a+' '+d.i+' '+d.o+' '+d.id).toLowerCase().includes(k)) &&
    (!fv.value||String(d.v)===fv.value) && (!fo.value||d.o===fo.value) &&
    (!fy.value||d.l===fy.value) && (!ft.value||d.y===ft.value));
  cnt.textContent='命中 '+r.length+' 篇';
  syncChips(); writeHash();
  if(!r.length){
    tb.innerHTML='<tr class="empty"><td colspan="5">没有匹配的论文 —— <a href="#" id="clr">清除全部筛选</a></td></tr>';
    return;
  }
  tb.innerHTML=r.map(d=>`<tr>
    <td class="id">${esc(d.id)}</td>
    <td><div class="tt"><a href="${d.u}" target="_blank" rel="noopener" title="点击直接下载官方终稿 PDF">${esc(d.t)}</a><button class="cp" data-url="${esc(d.u)}" title="复制该篇官方 PDF 直链">复制直链</button></div><div class="au">${esc(d.a)}${d.i?' · '+esc(d.i):''}</div></td>
    <td><span class="badges"><span class="b1">${esc(d.o)}</span><span class="b2">${esc(d.y)}</span>${d.x?'<span class="b4">'+esc(d.x)+'</span>':''}<span class="b3">${d.l==='中'?'中文':'英文'}</span></span></td>
    <td class="pg">${d.v==='0'?('未编入论文集'+(d.b?'<br>展位'+d.b:'')):('第'+d.v+'卷<br>p.'+d.p)}</td>
    <td><a href="${d.u}" target="_blank" rel="noopener">官方PDF</a></td>
  </tr>`).join('');
}

/* 复制直链 + 空结果一键清除 */
tb.addEventListener('click',async e=>{
  if(e.target.id==='clr'){ e.preventDefault(); q.value='';fv.value='';fo.value='';fy.value='';ft.value=''; render(); return; }
  const b=e.target.closest('.cp'); if(!b) return;
  e.preventDefault();
  const u=b.dataset.url, old=b.textContent;
  try{
    if(navigator.clipboard&&window.isSecureContext){ await navigator.clipboard.writeText(u); }
    else{ const t=document.createElement('textarea'); t.value=u; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
    b.textContent='已复制';
  }catch(_){ b.textContent='复制失败'; }
  setTimeout(()=>{b.textContent=old;},1400);
});

[q,fv,fo,fy,ft].forEach(e=>e.addEventListener('input',render));
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement!==q){e.preventDefault();q.focus();}
  if(e.key==='Escape'&&document.activeElement===q){q.value='';render();}
});
readHash(); render();
</script></body></html>
